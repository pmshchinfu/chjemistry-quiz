<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 學習導覽 - Week 3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft JhengHei", sans-serif; display: flex; height: 100vh; background-color: #f0f2f5; overflow: hidden; }
        
        /* 左側導覽欄 */
        .sidebar { width: 250px; background-color: #2c3e50; color: white; display: flex; flex-direction: column; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .sidebar h2 { text-align: center; margin-bottom: 30px; font-size: 1.5em; border-bottom: 1px solid #34495e; padding-bottom: 10px; }
        
        .nav-btn { background-color: #34495e; color: white; border: none; padding: 15px; margin-bottom: 15px; border-radius: 8px; font-size: 1.1em; cursor: pointer; text-decoration: none; text-align: center; transition: 0.3s; display: block; }
        .nav-btn:hover { background-color: #3498db; transform: translateX(5px); }
        .nav-btn.active { background-color: #2980b9; box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }
        
        /* 右側內容區 */
        .content { flex: 1; display: flex; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; background-color: white; }
        
        .welcome-msg { display: flex; justify-content: center; align-items: center; height: 100%; font-size: 1.5em; color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Week 3 課程</h2>
        
        <a href="week3.pdf" target="content-frame" class="nav-btn" onclick="setActive(this)">📄 學習講義</a>
        
        <a href="index_week3_quiz.html" target="content-frame" class="nav-btn" onclick="setActive(this)">📝 課後測驗</a>
        
        <div style="margin-top: auto; font-size: 0.8em; text-align: center; opacity: 0.6;">
            Python 程式設計課程
        </div>
    </div>

    <div class="content">
        <iframe name="content-frame" id="main-iframe" src="about:blank"></iframe>
        <div id="welcome" class="welcome-msg">請點選左側按鈕開始學習</div>
    </div>

    <script>
        function setActive(btn) {
            // 隱藏歡迎文字
            document.getElementById('welcome').style.display = 'none';
            
            // 移除所有按鈕的 active 樣式
            const btns = document.querySelectorAll('.nav-btn');
            btns.forEach(b => b.classList.remove('active'));
            
            // 加入當前按鈕的 active 樣式
            btn.classList.add('active');
        }

        // 預設開啟講義
        window.onload = function() {
            const firstBtn = document.querySelector('.nav-btn');
            // 如果您希望一進來就顯示講義，可以取消下面兩行的註解：
            // firstBtn.click();
            // setActive(firstBtn);
        };
    </script>
</body>
</html>
