<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Python 闖關：奇偶數判斷器</title>
    <style>
        :root { --primary: #4a90e2; --success: #2ecc71; --error: #e74c3c; --dark: #2c3e50; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; width: 90%; max-width: 550px; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: var(--dark); margin-top: 0; text-align: center; }
        .code-box { background-color: #1e1e1e; color: #d4d4d4; padding: 25px; border-radius: 8px; font-family: 'Consolas', 'Monaco', monospace; line-height: 1.8; position: relative; margin: 20px 0; font-size: 1.1em; }
        input { background: #333; border: 1px dashed #666; color: #4fc3f7; width: 45px; text-align: center; font-size: 1.1em; border-radius: 4px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); background: #444; }
        .btn-group { display: flex; gap: 10px; flex-direction: column; }
        button { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; font-weight: bold; transition: 0.2s; }
        #check-btn { background-color: var(--primary); color: white; }
        #check-btn:hover { background-color: #357abd; }
        #download-btn { background-color: #95a5a6; color: white; cursor: not-allowed; }
        #download-btn.active { background-color: var(--success); cursor: pointer; }
        #msg { margin-top: 15px; padding: 10px; border-radius: 5px; font-weight: bold; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎯 任務：完成奇偶數判斷程式</h2>
    <p>請在黑色的程式碼方塊中，填入正確的<b>運算子</b>來判斷偶數：</p>

    <div class="code-box">
        <div>num = int(input("請輸入數字: "))</div>
        <div>if num <input type="text" id="slot1" maxlength="1"> 2 <input type="text" id="slot2" maxlength="2"> 0:</div>
        <div style="padding-left: 25px;">print(f"{num} 是偶數")</div>
        <div>else:</div>
        <div style="padding-left: 25px;">print(f"{num} 是奇數")</div>
    </div>

    <div id="msg"></div>

    <div class="btn-group">
        <button id="check-btn" onclick="verify()">驗證答案</button>
        <button id="download-btn" onclick="downloadCode()" disabled>💾 下載我的 .py 檔案</button>
    </div>
</div>

<script>
    function verify() {
        const s1 = document.getElementById('slot1').value.trim();
        const s2 = document.getElementById('slot2').value.trim();
        const msg = document.getElementById('msg');
        const dlBtn = document.getElementById('download-btn');

        msg.style.display = 'block';

        if (s1 === '%' && s2 === '==') {
            msg.style.color = '#27ae60';
            msg.style.backgroundColor = '#e8f6ed';
            msg.innerText = "✅ 太棒了！邏輯完全正確。下載功能已解鎖！";
            dlBtn.disabled = false;
            dlBtn.className = 'active';
            dlBtn.innerText = "💾 點我下載 even_odd.py";
        } else {
            msg.style.color = '#c0392b';
            msg.style.backgroundColor = '#fdeaea';
            if (s2 === '=') {
                msg.innerText = "❌ 提示：程式中的「等於」要寫兩次喔！(==)";
            } else if (s1 === '/') {
                msg.innerText = "❌ 提示：/ 是除法，我們需要算「餘數」的符號。";
            } else {
                msg.innerText = "❌ 好像哪裡填錯了，再思考看看？";
            }
            dlBtn.disabled = true;
            dlBtn.className = '';
        }
    }

    function downloadCode() {
        const code = `num = int(input("請輸入一個整數："))\n\n# 利用餘數運算子 % 判斷\nif num % 2 == 0:\n    print(f"{num} 是偶數")\nelse:\n    print(f"{num} 是奇數")\n\ninput("\\n執行完畢，按 Enter 鍵結束...")`;
        const blob = new Blob([code], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'even_odd.py';
        a.click();
        window.URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
